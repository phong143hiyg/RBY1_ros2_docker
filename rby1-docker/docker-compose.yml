# Qt direct SDK runtime. The host Qt process is the only command owner and talks
# directly to the simulator's gRPC endpoint at localhost:50051.
name: rby1-qt-direct

services:
  rby1-sim:
    build:
      context: .
      dockerfile: Dockerfile.sim
      args:
        RBY1_SIM_TAG: 0.10.6-m_v1.2
        RBY1_SIM_DIGEST: sha256:1a462a3e11299d773c089c0c691a7f31b011a0408a8d503a0529b085fc0c9443
    image: local/rby1-sim:0.10.6-m_v1.2
    container_name: rby1-qt-direct-sim
    network_mode: host
    environment:
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: "1"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    labels:
      io.mynameisrobot.runtime: qt-direct
      io.mynameisrobot.robot-model: rby1-m-v1.2
      io.mynameisrobot.sdk-endpoint: localhost:50051
      io.mynameisrobot.command-owner: qt-host-process
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/50051'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped
