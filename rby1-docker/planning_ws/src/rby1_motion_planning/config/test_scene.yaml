# Fake demonstration fixture only. Frame is derived from RobotModel, not a world alias.
frame: base
objects:
  - id: floor
    type: box
    dimensions: [4.0, 4.0, 0.05]
    pose: {position: [0.0, 0.0, -0.055], orientation: [0.0, 0.0, 0.0, 1.0]}
  - id: table
    type: box
    dimensions: [0.5, 0.9, 0.05]
    pose: {position: [0.75, -0.25, 0.5], orientation: [0.0, 0.0, 0.0, 1.0]}
  - id: obstacle_box
    type: box
    dimensions: [0.10, 0.10, 0.22]
    pose: {position: [0.85, -0.6, 0.635], orientation: [0.0, 0.0, 0.0, 1.0]}
  - id: obstacle_column
    type: cylinder
    dimensions: [0.20, 0.04] # height, radius
    pose: {position: [0.86, 0.08, 0.625], orientation: [0.0, 0.0, 0.0, 1.0]}
  - id: target_object
    type: box
    dimensions: [0.035, 0.035, 0.06]
    pose: {position: [0.65, -0.3, 0.56], orientation: [0.0, 0.0, 0.0, 1.0]}
markers:
  pick TCP: {position: [0.65, -0.3, 0.64], orientation: [1.0, 0.0, 0.0, 0.0]}
  place object: {position: [0.7, -0.1, 0.56], orientation: [0.0, 0.0, 0.0, 1.0]}
  place TCP: {position: [0.7, -0.1, 0.64], orientation: [1.0, 0.0, 0.0, 0.0]}
  pre-grasp: {position: [0.65, -0.3, 0.74], orientation: [1.0, 0.0, 0.0, 0.0]}
  lift: {position: [0.65, -0.3, 0.79], orientation: [1.0, 0.0, 0.0, 0.0]}
  pre-place: {position: [0.7, -0.1, 0.79], orientation: [1.0, 0.0, 0.0, 0.0]}
  retreat: {position: [0.7, -0.1, 0.74], orientation: [1.0, 0.0, 0.0, 0.0]}
cartesian_directions:
  approach: {frame_id: base, vector: [0.0, 0.0, -1.0]}
  lift: {frame_id: base, vector: [0.0, 0.0, 1.0]}
  lower: {frame_id: base, vector: [0.0, 0.0, -1.0]}
  retreat: {frame_id: base, vector: [0.0, 0.0, 1.0]}
defaults:
  approach_distance_m: 0.08
  lift_distance_m: 0.12
  retreat_distance_m: 0.08
  planning_timeout_s: 30.0
  velocity_scale: 0.1
  acceleration_scale: 0.1
